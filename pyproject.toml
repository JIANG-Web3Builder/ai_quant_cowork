[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a-stock-research"
version = "0.1.0"
description = "A-share local data foundation for factor research, backtesting, and ML"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1.0",
  "numpy>=2.1.0",
  "pandas>=2.2.0",
  "polars>=1.8.0",
  "pyarrow>=17.0.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.2",
  "tushare>=1.4.18"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
